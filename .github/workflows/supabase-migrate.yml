# Run Supabase migrations: main → dev, prod → prod.
# Add repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF_DEV, SUPABASE_PROJECT_REF_PROD.
# See docs/deployment.md for setup.

name: Supabase migrations

on:
  push:
    branches: [main, prod]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Select project ref
        id: project
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_DEV }}" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
          fi

      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd supabase
          supabase link --project-ref "${{ steps.project.outputs.ref }}"
          supabase db push

      - name: Summary
        run: |
          echo "Migrations applied to **${{ steps.project.outputs.env }}** (branch: ${{ github.ref_name }})"
